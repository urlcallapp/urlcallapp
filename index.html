<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>urlcallapp - קישורים שמפעילים פעולות</title>
<meta name="description" content="יוצרים קישור, שולחים, ומי שפותח מקבל ישר הצעה להתקשר, לשלוח וואטסאפ או מייל.">
<style>
  :root{
    --ink:#1f1235;
    --card:rgba(255,255,255,.92);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Heebo","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#6d28d9 0%,#db2777 45%,#f59e0b 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;
    padding:24px 14px 60px;
  }
  .wrap{width:100%;max-width:560px}
  header{text-align:center;color:#fff;margin:18px 0 22px}
  header .logo{
    font-size:44px;font-weight:800;letter-spacing:-1px;
    text-shadow:0 3px 14px rgba(0,0,0,.25);
  }
  header .logo span{color:#fde047}
  header p{margin-top:6px;font-size:16px;opacity:.95}
  .card{
    background:var(--card);
    border-radius:26px;
    padding:22px 20px;
    box-shadow:0 18px 45px rgba(31,18,53,.35);
    backdrop-filter:blur(6px);
  }
  h2{font-size:19px;margin-bottom:12px}
  .proto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .proto{
    border:2.5px solid transparent;
    background:#f3efff;
    border-radius:18px;
    padding:12px 6px 10px;
    text-align:center;cursor:pointer;
    transition:transform .12s ease, border-color .12s, background .12s;
    user-select:none;
  }
  .proto:hover{transform:translateY(-2px)}
  .proto .ic{font-size:30px;line-height:1.1}
  .proto .nm{font-size:13.5px;font-weight:700;margin-top:4px}
  .proto[data-p="tel"].active{border-color:#7c3aed;background:#ede9fe}
  .proto[data-p="sms"].active{border-color:#0891b2;background:#e0f7fc}
  .proto[data-p="whatsapp"].active{border-color:#16a34a;background:#e6f9ed}
  .proto[data-p="mailto"].active{border-color:#db2777;background:#fde7f1}
  .proto[data-p="facetime"].active{border-color:#2563eb;background:#e3edfe}
  label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
  .hint{font-weight:400;color:#6b5f8a;font-size:12.5px}
  input,textarea,select{
    width:100%;font:inherit;font-size:16px;
    padding:12px 14px;border-radius:14px;border:2px solid #ddd6f3;
    background:#fff;color:var(--ink);outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:#7c3aed}
  textarea{min-height:74px;resize:vertical}
  .phone-row{display:flex;gap:8px;direction:ltr}
  .phone-row select{width:118px;flex:none;direction:ltr}
  .phone-row input{flex:1;direction:ltr;text-align:left}
  .ltr{direction:ltr;text-align:left}
  .btn{
    display:block;width:100%;border:0;cursor:pointer;
    font:inherit;font-weight:800;font-size:18px;color:#fff;
    padding:15px;border-radius:18px;margin-top:20px;
    background:linear-gradient(90deg,#7c3aed,#db2777);
    box-shadow:0 8px 22px rgba(124,58,237,.45);
    transition:transform .12s ease;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:scale(.98)}
  #result{display:none;margin-top:18px}
  #result.show{display:block}
  .link-box{
    display:flex;gap:8px;align-items:stretch;
  }
  #out{
    flex:1;font-size:13.5px;background:#f6f3ff;border:2px dashed #b9a8f0;
    border-radius:14px;padding:11px 12px;word-break:break-all;direction:ltr;text-align:left;
    display:flex;align-items:center;
  }
  .copy-btn{
    flex:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;
    border-radius:14px;padding:0 16px;color:#fff;
    background:linear-gradient(90deg,#f59e0b,#ea580c);
    box-shadow:0 6px 16px rgba(234,88,12,.4);
    transition:transform .12s;
  }
  .copy-btn:active{transform:scale(.95)}
  .copy-btn.ok{background:linear-gradient(90deg,#16a34a,#059669)}
  .actions-row{display:flex;gap:8px;margin-top:10px}
  .ghost{
    flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14.5px;
    padding:11px;border-radius:14px;border:2px solid #c9bdf0;color:#5b21b6;background:#fff;
  }
  .ghost:hover{background:#f3efff}
  /* landing mode */
  #landing{display:none;text-align:center}
  body.landing #builder,body.landing header .sub{display:none}
  body.landing #landing{display:block}
  .big-ic{font-size:84px;line-height:1.15;animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  .land-title{font-size:24px;font-weight:800;margin:10px 0 4px}
  .land-detail{font-size:17px;color:#4c3f73;word-break:break-all;direction:ltr}
  .land-note{font-size:13.5px;color:#6b5f8a;margin-top:14px}
  footer{color:#fff;text-align:center;margin-top:26px;font-size:13px;opacity:.9}
  footer a{color:#fde047;text-decoration:none;font-weight:700}
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#16a34a;color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;
    opacity:0;pointer-events:none;transition:all .25s ease;box-shadow:0 10px 26px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">url<span>call</span>app</div>
    <p class="sub">יוצרים קישור 🎨 שולחים לחבר 📨 ומי שפותח - מקבל ישר הצעה לפעולה ⚡</p>
  </header>

  <div class="card" id="builder">
    <h2>1. מה הקישור יעשה?</h2>
    <div class="proto-grid" id="protos"></div>

    <div id="fields"></div>

    <button class="btn" id="gen">✨ צור קישור</button>

    <div id="result">
      <h2>2. הקישור מוכן 🎉</h2>
      <div class="link-box">
        <div id="out"></div>
        <button class="copy-btn" id="copy">העתקה</button>
      </div>
      <div class="actions-row">
        <a class="ghost" id="try" href="#" target="_blank" rel="noopener">🧪 נסה את הקישור</a>
        <button class="ghost" id="share">📤 שיתוף</button>
      </div>
    </div>
  </div>

  <div class="card" id="landing">
    <div class="big-ic" id="lIc">📞</div>
    <div class="land-title" id="lTitle"></div>
    <div class="land-detail" id="lDetail"></div>
    <button class="btn" id="lGo"></button>
    <div class="land-note" id="lNote">אם הפעולה לא נפתחה לבד - לוחצים על הכפתור 👆</div>
  </div>

  <footer>
    נבנה עם 💜 על ידי <a href="https://github.com/urlcallapp" target="_blank" rel="noopener">urlcallapp</a> · הכל קורה בדפדפן, בלי שרת ובלי שמירת מידע
  </footer>
</div>
<div class="toast" id="toast">הקישור הועתק! ✅</div>

<script>
(function(){
  "use strict";

  var PROTOCOLS = {
    tel: {
      name:"שיחה", icon:"📞",
      fields:[{k:"phone",type:"phone",label:"מספר טלפון",hint:"למשל 050-1234567"}],
      target:function(d){ return "tel:" + d.phoneDial; },
      land:function(d){ return {title:"שיחה יוצאת אל", detail:d.phonePretty, btn:"📞 התקשר עכשיו"}; }
    },
    sms: {
      name:"SMS", icon:"💬",
      fields:[
        {k:"phone",type:"phone",label:"מספר טלפון"},
        {k:"text",type:"textarea",label:"הודעה (לא חובה)"}
      ],
      target:function(d){ return "sms:" + d.phoneDial + (d.text ? "?&body=" + encodeURIComponent(d.text) : ""); },
      land:function(d){ return {title:"שליחת SMS אל", detail:d.phonePretty, btn:"💬 פתח הודעה"}; }
    },
    whatsapp: {
      name:"וואטסאפ", icon:"🟢",
      anyOf:["phone","text"],
      fields:[
        {k:"phone",type:"phone",label:"מספר טלפון",hint:"או למטה: הודעה בלבד והנמען ייבחר בוואטסאפ"},
        {k:"text",type:"textarea",label:"הודעה מוכנה מראש"}
      ],
      target:function(d){
        if(d.phoneIntl){ return "https://wa.me/" + d.phoneIntl + (d.text ? "?text=" + encodeURIComponent(d.text) : ""); }
        return "https://wa.me/?text=" + encodeURIComponent(d.text);
      },
      land:function(d){
        if(d.phoneIntl) return {title:"שיחת וואטסאפ עם", detail:d.phonePretty, btn:"🟢 פתח וואטסאפ"};
        return {title:"הודעת וואטסאפ", detail:d.text || "", btn:"🟢 בחר נמען בוואטסאפ"};
      }
    },
    mailto: {
      name:"אימייל", icon:"✉️",
      fields:[
        {k:"email",type:"email",label:"כתובת מייל"},
        {k:"subject",type:"text",label:"נושא (לא חובה)"},
        {k:"body",type:"textarea",label:"תוכן (לא חובה)"}
      ],
      target:function(d){
        var q=[];
        if(d.subject) q.push("subject=" + encodeURIComponent(d.subject));
        if(d.body) q.push("body=" + encodeURIComponent(d.body));
        return "mailto:" + d.email + (q.length ? "?" + q.join("&") : "");
      },
      land:function(d){ return {title:"כתיבת מייל אל", detail:d.email, btn:"✉️ פתח מייל"}; }
    },
    facetime: {
      name:"FaceTime", icon:"📹",
      fields:[{k:"phone",type:"phone",label:"מספר טלפון או אימייל",hint:"מספר, או כתובת מייל של Apple ID"}],
      target:function(d){ return "facetime:" + (d.phoneDial || d.raw); },
      land:function(d){ return {title:"שיחת FaceTime אל", detail:d.phonePretty, btn:"📹 התחל FaceTime"}; }
    },
  };

  var CODES = [
    ["+972","🇮🇱 +972"],["+1","🇺🇸 +1"],["+44","🇬🇧 +44"],["+49","🇩🇪 +49"],
    ["+33","🇫🇷 +33"],["+39","🇮🇹 +39"],["+34","🇪🇸 +34"],["+7","🇷🇺 +7"],
    ["+91","🇮🇳 +91"],["+971","🇦🇪 +971"],["+90","🇹🇷 +90"]
  ];

  var $ = function(id){ return document.getElementById(id); };
  var builder=$("builder"), protosEl=$("protos"), fieldsEl=$("fields"),
      resultEl=$("result"), outEl=$("out"), copyBtn=$("copy"), tryLink=$("try"),
      shareBtn=$("share"), toast=$("toast");

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  /* ---------- landing mode ---------- */
  var qs = new URLSearchParams(location.search);
  var lp = qs.get("p");
  if(lp && PROTOCOLS[lp]){
    var data = {};
    qs.forEach(function(v,k){ if(k!=="p") data[k]=v; });
    decoratePhone(data);
    var proto = PROTOCOLS[lp];
    var target;
    try { target = proto.target(data); } catch(e){ target=null; }
    if(target){
      var info = proto.land(data);
      document.body.classList.add("landing");
      document.title = info.title + " " + (info.detail||"") + " · urlcallapp";
      $("lIc").textContent = proto.icon;
      $("lTitle").textContent = info.title;
      $("lDetail").textContent = info.detail || "";
      var go = $("lGo");
      go.textContent = info.btn;
      go.addEventListener("click", function(){ window.location.href = target; });
      // ניסיון פתיחה אוטומטי; חלק מהדפדפנים דורשים מגע של המשתמש ואז הכפתור מחכה
      setTimeout(function(){ window.location.href = target; }, 650);
      return;
    }
  }

  /* ---------- builder mode ---------- */
  var current = "tel";

  Object.keys(PROTOCOLS).forEach(function(key){
    var p = PROTOCOLS[key];
    var el = document.createElement("div");
    el.className = "proto" + (key===current ? " active":"");
    el.dataset.p = key;
    el.innerHTML = '<div class="ic">'+p.icon+'</div><div class="nm">'+esc(p.name)+'</div>';
    el.addEventListener("click", function(){
      current = key;
      Array.prototype.forEach.call(protosEl.children,function(c){
        c.classList.toggle("active", c.dataset.p===key);
      });
      renderFields();
      resultEl.classList.remove("show");
    });
    protosEl.appendChild(el);
  });

  function renderFields(){
    var p = PROTOCOLS[current];
    fieldsEl.innerHTML = "";
    p.fields.forEach(function(f){
      var lab = document.createElement("label");
      lab.innerHTML = esc(f.label) + (f.hint ? ' <span class="hint">'+esc(f.hint)+'</span>' : "");
      fieldsEl.appendChild(lab);
      if(f.type==="phone"){
        var row = document.createElement("div");
        row.className = "phone-row";
        var sel = document.createElement("select");
        sel.id = "f_"+f.k+"_code";
        CODES.forEach(function(c){
          var o=document.createElement("option");
          o.value=c[0]; o.textContent=c[1];
          sel.appendChild(o);
        });
        var inp = document.createElement("input");
        inp.id = "f_"+f.k; inp.type="tel"; inp.placeholder="50-123-4567";
        inp.autocomplete="off"; inp.inputMode="tel";
        row.appendChild(sel); row.appendChild(inp);
        fieldsEl.appendChild(row);
      } else if(f.type==="textarea"){
        var ta=document.createElement("textarea");
        ta.id="f_"+f.k; ta.placeholder=f.label.replace(" (לא חובה)","");
        fieldsEl.appendChild(ta);
      } else {
        var i2=document.createElement("input");
        i2.id="f_"+f.k; i2.type = f.type==="email" ? "email" : "text";
        if(f.type==="email") i2.className="ltr";
        fieldsEl.appendChild(i2);
      }
    });
  }
  renderFields();

  function val(k){ var e=$("f_"+k); return e ? e.value.trim() : ""; }

  function decoratePhone(d){
    if(!d.phone) return;
    var raw = d.phone;
    var code = d.phone_code || "";
    var digits = raw.replace(/[^\d+]/g,"");
    var intl;
    if(digits.charAt(0)==="+"){ intl = digits.slice(1); }
    else if(code){ intl = code.replace("+","") + digits.replace(/^0+/,""); }
    else if(/^0/.test(digits)){ intl = "972" + digits.replace(/^0+/,""); }
    else { intl = digits; }
    d.raw = raw;
    d.phoneIntl = intl;
    d.phoneDial = /^\+/.test(digits) ? digits : (code ? code + digits.replace(/^0+/,"") : digits);
    d.phonePretty = raw;
  }

  $("gen").addEventListener("click", function(){
    var p = PROTOCOLS[current];
    var params = new URLSearchParams();
    params.set("p", current);
    var missing = false;
    p.fields.forEach(function(f){
      var v = val(f.k);
      if(f.type==="phone"){
        var codeEl = $("f_"+f.k+"_code");
        if(!v && !p.anyOf){ missing = true; }
        if(v) params.set("phone", v);
        if(codeEl && v) params.set("phone_code", codeEl.value);
      } else {
        if(!v && !p.anyOf && f.label.indexOf("לא חובה")===-1) missing = true;
        if(v) params.set(f.k, v);
      }
    });
    if(p.anyOf){
      var any = p.anyOf.some(function(k){ return !!val(k); });
      if(!any) missing = true;
    }
    if(missing){
      toast.textContent = "חסר שדה חובה ✍️";
      toast.style.background="#dc2626";
      toast.classList.add("show");
      setTimeout(function(){ toast.classList.remove("show"); }, 1800);
      return;
    }
    var url = location.origin + location.pathname + "?" + params.toString();
    outEl.textContent = url;
    tryLink.href = url;
    resultEl.classList.add("show");
    resultEl.scrollIntoView({behavior:"smooth", block:"nearest"});
  });

  function doCopy(){
    var text = outEl.textContent;
    function ok(){
      copyBtn.textContent = "הועתק ✅";
      copyBtn.classList.add("ok");
      toast.textContent = "הקישור הועתק! ✅";
      toast.style.background="#16a34a";
      toast.classList.add("show");
      setTimeout(function(){
        toast.classList.remove("show");
        copyBtn.textContent = "העתקה";
        copyBtn.classList.remove("ok");
      }, 1800);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      var ta=document.createElement("textarea");
      ta.value=text; document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand("copy"); ok(); }catch(e){}
      document.body.removeChild(ta);
    }
  }
  copyBtn.addEventListener("click", doCopy);

  shareBtn.addEventListener("click", function(){
    var url = outEl.textContent;
    if(navigator.share){
      navigator.share({title:"urlcallapp", url:url}).catch(function(){});
    } else {
      doCopy();
    }
  });
})();
</script>
</body>
</html>
